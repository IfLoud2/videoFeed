name: daily-feed

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Générer la liste
        run: python build_feed.py
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
      - name: Publier
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add docs data
          git diff --cached --quiet || git commit -m "liste du jour"
          git push
